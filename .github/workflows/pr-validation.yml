name: PR Validation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pr-validation.yml"

jobs:
  validate:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  secret-scan:
    runs-on: self-hosted

    steps:
      - name: Secret Scan
        uses: cvs-health-source-code/Secure-Pipeline-Scans/gha/secret-scan/gitleaks@v2
        with:
          GHA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
