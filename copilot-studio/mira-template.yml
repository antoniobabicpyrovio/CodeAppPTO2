#
# AUTHORITATIVE BOT DEFINITION: solution/src/bots/pmo_mira/bot.xml
# This template file represents the bootstrap content used during initial agent creation.
# Topic definitions for Mira are maintained in copilot-studio/topics/*.topic.yml.
# Source artifacts live in solution/src/bots/ and solution/src/botcomponents/.
