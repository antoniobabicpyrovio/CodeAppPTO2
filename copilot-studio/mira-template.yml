# MIRA AGENT — BOOTSTRAP TEMPLATE AND LIVE AGENT IDENTITY
#
# LIVE AGENT IDENTITY (provisioned from this template via pac copilot create):
#   Name:                     Mira
#   Schema name:              pmo_mira
#   Dataverse Copilot ID:     bee26fa0-bf3e-43e0-836f-4df459d1c00c
#   Entra Application ID:     c408fa39-32fb-4b30-982f-6c27a99d460e
#   Environment ID:           731e4975-10cd-4535-b82f-1ff016e59b6c
#   Tenant ID:                fabb61b8-3afe-4e75-b934-a47f782b8cd7
#   Provisioned:              2026-04-19
